server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: evops-base
  profiles:
    active: dev
  aop:
    proxy-target-class: true
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:h2:file:./data/evops;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.evops
  configuration:
    map-underscore-to-camel-case: true

evops:
  quota:
    # 预占占用有效期（分钟）：超时由定时任务自动归还；实扣必须在有效期内完成
    hold-minutes: 40
    # 过期预占扫描（默认每分钟第 17 秒，避开整分）；启动时另补扫一次停机期间过期的预占
    expire-scan-cron: "17 * * * * ?"
  sensitive:
    # 敏感词库路径。classpath: 随包默认；生产改 file:/path/sensitive-words.txt，
    # 文件变更自动热更新（扫描前懒检查 mtime），或 POST /api/sensitive/words/reload 立即重载
    dict-path: classpath:sensitive-words.txt
  batch:
    # 批量后台任务记录保留天数：终态任务 expire_time = 完成时间 + 该天数，到期定时物理清理
    retain-days: 21
    # 到期清理执行时刻（每日）；默认凌晨 03:17，避开整点
    cleanup-cron: "0 17 3 * * ?"

logging:
  level:
    com.evops: INFO
