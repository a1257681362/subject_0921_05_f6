server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: evops-base
  profiles:
    active: dev
  aop:
    proxy-target-class: true
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:h2:file:./data/evops;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.evops
  configuration:
    map-underscore-to-camel-case: true

evops:
  quota:
    # 预占占用有效期（分钟）：超时由定时任务自动归还；实扣必须在有效期内完成
    hold-minutes: 40
    # 过期预占扫描（默认每分钟第 17 秒，避开整分）；启动时另补扫一次停机期间过期的预占
    expire-scan-cron: "17 * * * * ?"
  sensitive:
    # 敏感词库路径。classpath: 随包默认；生产改 file:/path/sensitive-words.txt，
    # 文件变更自动热更新（扫描前懒检查 mtime），或 POST /api/sensitive/words/reload 立即重载
    dict-path: classpath:sensitive-words.txt
  batch:
    # 批量后台任务记录保留天数：终态任务 expire_time = 完成时间 + 该天数，到期定时物理清理
    retain-days: 21
    # 到期清理执行时刻（每日）；默认凌晨 03:17，避开整点
    cleanup-cron: "0 17 3 * * ?"
  report:
    # 验光师加工单周报 Word 模板（poi-tl）。classpath: 随包默认；
    # 生产改 file:/path/weekly-order-summary.docx 外置，替换文件后下次生成即生效（懒检查 mtime）。
    template-path: classpath:report/templates/weekly-order-summary.docx
    # 明细表隔行底色（十六进制 RGB）；留空不上色
    zebra-fill: F2F6FB
    # 明细表表头行数（数据行之前不参与隔行上色的行数）
    detail-header-row: 1
    # 单次批量按店导出的门店数上限
    batch-store-limit: 200
    # 模板变量/明细标签名：验光师改模板里的变量名后，在这里对齐即可，无需改代码
    tags:
      orders: orders            # 明细表循环标签（表头下一行数据行首格写 {{orders}}[orderNo]）
      store-code: storeCode
      period-start: periodStart
      period-end: periodEnd
      generated-at: generatedAt
      total-count: totalCount
      rework-count: reworkCount
      rework-rate: reworkRate
      lens-summary: lensSummary
      columns:
        order-no: orderNo
        lens-name: lensName
        order-date: orderDate
        status-text: statusText
        customer: customer
        rework-text: reworkText

logging:
  level:
    com.evops: INFO
